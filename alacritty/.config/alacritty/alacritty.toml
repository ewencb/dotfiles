[font]
normal = { family = "Terminus (TTF)" }
size = 14

[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001B\r"

[cursor.style]
shape    = "Underline"
blinking = "On"

# IBM CGA text mode, 16 colours

[colors.primary]
background = "#000000"
foreground = "#aaaaaa"

[colors.cursor]
text   = "#000000"
cursor = "#aaaaaa"

[colors.selection]
text       = "#000000"
background = "#aaaaaa"   # inverse video, very DOS

[colors.normal]
black   = "#000000"
red     = "#aa0000"
green   = "#00aa00"
yellow  = "#aa5500"      # the famous brown
blue    = "#0000aa"
magenta = "#aa00aa"
cyan    = "#00aaaa"
white   = "#aaaaaa"

[colors.bright]
black   = "#555555"
red     = "#ff5555"
green   = "#55ff55"
yellow  = "#ffff55"
blue    = "#5555ff"
magenta = "#ff55ff"
cyan    = "#55ffff"
white   = "#ffffff"
