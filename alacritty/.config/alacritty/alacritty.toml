# Font and colours are generated by `theme` (see the theme package)
[general]
import = ["~/.local/state/theme/alacritty.toml"]

[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001B\r"

[cursor]
blink_interval = 267 # CGA blink rate: 16 frames on, 16 off at 60 Hz
blink_timeout = 0    # never stop blinking when idle

[cursor.style]
shape = "Underline"
blinking = "Always" # ignore apps asking for a steady cursor
